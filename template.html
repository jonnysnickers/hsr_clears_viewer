<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HSR Clears Viewer</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    select { margin-right: 10px; padding: 4px; }
    
    
    .unit { position: relative; width: 80px; text-align: center; font-size: 12px; }
    .unit img { width: 100%; border-radius: 8px; }
    .badge {
      position: absolute;
      background: rgba(0,0,0,0.75);
      color: white;
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .eidolon { top: 4px; left: 4px; }
    .superimp { bottom: 4px; right: 4px; }
    .toggle { cursor: pointer; color: #0066cc; margin: 6px 0; display: inline-block; }
    .hidden { display: none; }
    
    .clear {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .team {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .meta {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      font-size: 14px;
    }
    
  </style>
</head>
<body>
  <h1>Clears Backup</h1>

  <label>
    Mode:
    <select id="modeSelect"></select>
  </label>

  <label>
    Subcategory:
    <select id="subcategorySelect">
      <option value="">All</option>
    </select>
  </label>

  <div id="results"></div>

  <script>
    /*__DATA__*/
    // Python build script must inject: const DATA = [...];

    const data = DATA;
    const name_replacements = {"Trailblazer: Harmony": "Trailblazer (Harmony)", "Trailblazer: Destruction": "Trailblazer (Destruction)", "Trailblazer: Preservation":"Trailblazer (Preservation)"}

    initFilters();
    render();

    function initFilters() {
      const modeSelect = document.getElementById('modeSelect');
      const subSelect = document.getElementById('subcategorySelect');

      // Map: modeKey -> Set(subcategories)
      const subMap = {};
      const modeSet = new Set();

      data.forEach(d => {
        const modeKey = `${d.season} | ${d.mode} | ${d.boss_name}`;
        modeSet.add(modeKey);

        if (!subMap[modeKey]) subMap[modeKey] = new Set();

        const sub = d.subcategory;
        if (sub && String(sub).trim() !== '' && String(sub).toLowerCase() !== 'null') {
          subMap[modeKey].add(String(sub).trim());
        }
      });

      // populate modes
      [...modeSet].sort().reverse().forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modeSelect.appendChild(opt);
      });

      function updateSubcategories() {
        subSelect.innerHTML = '<option value="">All</option>';
        const currentMode = modeSelect.value;
        if (!currentMode || !subMap[currentMode]) return;

        [...subMap[currentMode]].sort().forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          subSelect.appendChild(opt);
        });
      }

      modeSelect.onchange = () => {
        updateSubcategories();
        render();
      };

      subSelect.onchange = render;

      updateSubcategories();
    }

    function render() {
      const modeSelect = document.getElementById('modeSelect');
      const subSelect = document.getElementById('subcategorySelect');
      const container = document.getElementById('results');
      container.innerHTML = '';

      const modeVal = modeSelect.value;
      const subVal = subSelect.value;
      if (!modeVal) return;

      const filtered = data.filter(d => {
        const m = `${d.season} | ${d.mode} | ${d.boss_name}`;
        return m === modeVal && (!subVal || d.subcategory === subVal);
      });

      const groups = {};
      filtered.forEach(d => {
        if (!groups[d.p1_char]) groups[d.p1_char] = [];
        groups[d.p1_char].push(d);
      });

      Object.values(groups).forEach(arr =>
        arr.sort((a,b) => a.total_limited_5star_count - b.total_limited_5star_count)
      );

      Object.entries(groups)
        .sort(([,a],[,b]) => a[0].total_limited_5star_count - b[0].total_limited_5star_count)
        .forEach(([char, runs]) => {
          const section = document.createElement('div');
          section.innerHTML = `<h2>${char}</h2>`;

          const first = renderRun(runs[0]);
          section.appendChild(first);

          if (runs.length > 1) {
            const toggle = document.createElement('div');
            toggle.className = 'toggle';
            toggle.textContent = `Show ${runs.length - 1} more runs`;

            const extra = document.createElement('div');
            extra.className = 'hidden';

            toggle.onclick = () => {
              extra.classList.toggle('hidden');
              toggle.textContent = extra.classList.contains('hidden')
                ? `Show ${runs.length - 1} more runs`
                : 'Hide extra runs';
            };

            runs.slice(1).forEach(d => {
              const div = renderRun(d);
              extra.appendChild(div);
            });

            section.appendChild(toggle);
            section.appendChild(extra);
          }

          container.appendChild(section);
        });
    }

    function renderRun(d) {
        const div = document.createElement('div');
        div.className = 'clear';

        div.innerHTML = `
          <div class="team">
            ${renderUnit(d.p1_char, d.p1_eidolon, d.p1_lc, d.p1_superimp)}
            ${renderUnit(d.p2_char, d.p2_eidolon, d.p2_lc, d.p2_superimp)}
            ${renderUnit(d.p3_char, d.p3_eidolon, d.p3_lc, d.p3_superimp)}
            ${renderUnit(d.p4_char, d.p4_eidolon, d.p4_lc, d.p4_superimp)}
          </div>

          <div class="meta">
            <div><a href="${d.video_url}" target="_blank">${d.author_name} - ${d.video_date}</a></div>
            <div>Limited 5★: <b>${d.total_limited_5star_count}</b>, Standard 5★: <b>${d.total_standard_5star_count}</b></div>
            <div> action_value: ${d.action_value} | metric_value: ${d.metric_value}</div>
          </div>
        `;
        return div
    }

    function renderUnit(char, eidolon, lc, superimp) {
      if (!char) return '';
      return `
        <div class="unit">
          <img src="px_char/${char in name_replacements?name_replacements[char]:char}.png" onerror="this.replaceWith(document.createTextNode('${char}'))">
          <div class="badge eidolon">E${eidolon}</div>
          <img src="px_lc/${lc}.png" onerror="this.replaceWith(document.createTextNode('${lc}'))">
          <div class="badge superimp">S${superimp}</div>
        </div>`;
    }
  </script>
</body>
</html>
